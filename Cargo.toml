[workspace]
resolver = "2"
members = [
    "crates/egui-prismglass",
    "crates/demo",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/kayoinreality/egui-prismglass"
authors = ["Kayo Santos <64989138+kayoinreality@users.noreply.github.com>"]
keywords = ["egui", "gui", "glassmorphism", "design-system", "ui"]
categories = ["gui", "rendering"]

[workspace.dependencies]
# Pinned explicitly to guarantee API compatibility across egui breaking releases.
# See the Compatibility Table in README.md for version mappings.
egui = "0.37.0"
eframe = "0.37.0"
serde = { version = "1.0", features = ["derive"] }
egui-prismglass = { version = "0.1.0", path = "crates/egui-prismglass" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
