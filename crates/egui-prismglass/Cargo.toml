[package]
name = "egui-prismglass"
description = "A modern design system and widget kit for egui: Inter typography, neutral tokens, Layered and all-glass materials, with opt-in real GPU backdrop blur (WGSL Dual-Kawase for wgpu, live grab-pass for glow)."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["inter"]
## Bundles the Inter typeface (SIL OFL 1.1, ~0.9 MB) used by the Prism presets. Install it with
## `egui_prismglass::install_fonts(ctx)`; without this feature widgets fall back to egui's fonts.
inter = []
## Enables `serde::Serialize` and `serde::Deserialize` on design tokens and themes.
serde = ["dep:serde", "egui/serde"]
## Enables real GPU Dual-Kawase backdrop blur + Apple Liquid Glass WGSL optics on `wgpu 30` (`eframe+wgpu` & own-loop `egui-wgpu`).
blur-wgpu = ["dep:wgpu", "dep:egui-wgpu", "dep:bytemuck"]
## Enables live-framebuffer grab-pass backdrop blur on `glow 0.17` (`eframe+glow`) via `backdrop-blur-glow`.
blur-glow = ["dep:backdrop-blur-core", "dep:backdrop-blur-glow", "dep:egui_glow", "dep:glow"]

[dependencies]
egui.workspace = true
serde = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
backdrop-blur-core = { workspace = true, optional = true }
backdrop-blur-glow = { workspace = true, optional = true }
egui_glow = { workspace = true, optional = true }
glow = { workspace = true, optional = true }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[[bench]]
name = "surface_bench"
harness = false

[[example]]
name = "gpu_benchmark"
required-features = ["blur-wgpu"]

[lints]
workspace = true
