[package]
name = "demo"
description = "Interactive showcase demo for egui-prismglass with real GPU backdrop blur."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["blur-wgpu"]
blur-wgpu = ["egui-prismglass/blur-wgpu"]
blur-glow = ["egui-prismglass/blur-glow", "eframe/glow"]

[[example]]
name = "glow_blur"
required-features = ["blur-glow"]

[dependencies]
eframe.workspace = true
egui.workspace = true
egui-prismglass.workspace = true

# Web build (`trunk build` in crates/demo): eframe's web wgpu backend needs WebGPU/WebGL enabled.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }
wgpu = { version = "30.0", default-features = false, features = ["webgl", "webgpu", "wgsl"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
