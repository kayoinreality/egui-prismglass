name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy & Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Verify feature matrix builds
        run: |
          cargo check -p egui-prismglass --no-default-features
          cargo check -p egui-prismglass --features serde
          cargo check -p egui-prismglass --features blur-wgpu
          cargo check -p egui-prismglass --features blur-glow
          cargo check -p egui-prismglass --benches
          cargo check -p egui-prismglass --features blur-wgpu --example gpu_benchmark
          cargo check -p demo --no-default-features --features blur-glow --example glow_blur
      - name: Verify the web demo builds for WebAssembly
        run: |
          cargo check -p egui-prismglass --target wasm32-unknown-unknown
          cargo check -p demo --target wasm32-unknown-unknown --no-default-features
          cargo clippy -p demo --target wasm32-unknown-unknown --no-default-features -- -D warnings
      - name: Verify rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p egui-prismglass --all-features --no-deps

  test-and-build:
    name: Test & Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI & software Vulkan dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev \
            mesa-vulkan-drivers
      - name: Run unit & doc tests (feature matrix)
        run: |
          cargo test -p egui-prismglass --no-default-features --lib
          cargo test -p egui-prismglass --no-default-features --doc
          cargo test -p egui-prismglass --features blur-wgpu --lib
          cargo test -p egui-prismglass --features blur-wgpu --doc
          cargo test -p egui-prismglass --features blur-glow --lib
          cargo test -p egui-prismglass --features blur-glow --doc
      - name: Run real GPU blur & visual regression matrix (Linux software Vulkan)
        if: runner.os == 'Linux'
        run: |
          cargo test -p egui-prismglass --features blur-wgpu --test wgpu_blur -- --test-threads=1
          cargo test -p egui-prismglass --features blur-wgpu --test visual_regression -- --test-threads=1
      - name: Build workspace (core + demo)
        run: cargo build --workspace
