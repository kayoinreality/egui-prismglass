name: Release to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish --dry-run without publishing"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish egui-prismglass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify release tag matches Cargo.toml version
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CRATE_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "egui-prismglass") | .version')"
          echo "Tag version:   ${TAG_VERSION}"
          echo "Crate version: ${CRATE_VERSION}"
          if [ "${TAG_VERSION}" != "${CRATE_VERSION}" ]; then
            echo "::error::GitHub release tag (${GITHUB_REF_NAME}) does not match Cargo.toml version (${CRATE_VERSION})."
            exit 1
          fi

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev

      - name: Format & Clippy checks
        run: |
          cargo fmt --all -- --check
          cargo clippy -p egui-prismglass --all-targets --all-features -- -D warnings

      - name: Run library tests & doctests
        run: cargo test -p egui-prismglass --all-features

      - name: Dry-run package verification
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: cargo publish -p egui-prismglass --dry-run

      - name: Publish to crates.io
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::Missing CARGO_REGISTRY_TOKEN secret in repository settings."
            exit 1
          fi
          cargo publish -p egui-prismglass
